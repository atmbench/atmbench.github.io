name: Verify leaderboard data

on:
  push:
    paths:
      - 'leaderboard.html'
      - 'static/js/atm_hard_rows.js'
      - 'docs/memexa-v2-rejudge.json'
      - 'docs/sensemem-main.json'
      - 'docs/sensemem-main.md'
      - 'docs/sensemem/**'
      - 'tools/verify_leaderboard.mjs'
  pull_request:
    paths:
      - 'leaderboard.html'
      - 'static/js/atm_hard_rows.js'
      - 'docs/memexa-v2-rejudge.json'
      - 'docs/sensemem-main.json'
      - 'docs/sensemem-main.md'
      - 'docs/sensemem/**'
      - 'tools/verify_leaderboard.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/verify_leaderboard.mjs
