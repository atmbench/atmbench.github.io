name: Verify leaderboard data

on:
  push:
    paths:
      - 'leaderboard.html'
      - 'index.html'
      - 'static/js/**'
      - 'docs/memexa-v2-rejudge.json'
      - 'docs/rolling-memory-zhao.json'
      - 'docs/rolling-memory-zhao-qwen3vl8b.json'
      - 'docs/rolling-memory/zhao/judge-requests-main-1013.jsonl'
      - 'docs/rolling-memory/zhao/judge-requests-hard-31.jsonl'
      - 'docs/rolling-memory/zhao-qwen3vl8b/judge-requests-main-1013.jsonl'
      - 'docs/rolling-memory/zhao-qwen3vl8b/judge-requests-hard-31.jsonl'
      - 'docs/rolling-memory/zhao/**'
      - 'docs/rolling-memory/zhao-qwen3vl8b/**'
      - 'tools/verify_leaderboard.mjs'
  pull_request:
    paths:
      - 'leaderboard.html'
      - 'index.html'
      - 'static/js/**'
      - 'docs/memexa-v2-rejudge.json'
      - 'docs/rolling-memory-zhao.json'
      - 'docs/rolling-memory-zhao-qwen3vl8b.json'
      - 'docs/rolling-memory/zhao/judge-requests-main-1013.jsonl'
      - 'docs/rolling-memory/zhao/judge-requests-hard-31.jsonl'
      - 'docs/rolling-memory/zhao-qwen3vl8b/judge-requests-main-1013.jsonl'
      - 'docs/rolling-memory/zhao-qwen3vl8b/judge-requests-hard-31.jsonl'
      - 'docs/rolling-memory/zhao/**'
      - 'docs/rolling-memory/zhao-qwen3vl8b/**'
      - 'tools/verify_leaderboard.mjs'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/verify_leaderboard.mjs
